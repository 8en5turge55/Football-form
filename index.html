<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>⚽</text></svg>">
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Football Form Table</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Crimson+Pro:wght@600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:        #0d0d0d;
      --surface:   #141414;
      --surface2:  #1c1c1c;
      --border:    rgba(255,255,255,0.08);
      --border2:   rgba(255,255,255,0.14);
      --text:      #f0f0ee;
      --muted:     #888;
      --accent:    #c8f04a;
      --accent-fg: #0d0d0d;
      --win:       #4ade80;
      --draw:      #888;
      --loss:      #f87171;
      --font:      'Crimson Pro', Georgia, serif;
      --mono:      'IBM Plex Mono', monospace;
      --radius:    6px;
      --radius-lg: 10px;
    }

    body {
      font-family: var(--font);
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      font-size: 14px;
      line-height: 1.5;
    }

    /* Layout */
    header {
      border-bottom: 1px solid var(--border);
      padding: 0.5rem 2rem;
      display: flex;
      align-items: baseline;
      gap: 1rem;
    }
    header h1 { font-size: 15px; font-weight: 600; letter-spacing: 0.02em; }
    header span { font-size: 12px; color: var(--muted); font-family: var(--mono); }

    .container {
      max-width: 1200px;
      margin: 0 auto;
      padding: 0.6rem 2rem 4rem;
    }

    /* Top-level view nav */
    .view-nav {
      display: flex;
      gap: 0;
      margin-bottom: 0.75rem;
      border-bottom: 1px solid var(--border);
      align-items: center;
    }
    .view-tab {
      padding: 8px 18px;
      background: transparent;
      border: none;
      border-bottom: 2px solid transparent;
      color: var(--muted);
      font-size: 13px;
      font-family: var(--font);
      font-weight: 500;
      cursor: pointer;
      transition: all 0.12s;
      margin-bottom: -1px;
    }
    .view-tab:hover { color: var(--text); }
    .view-tab.active { color: var(--accent); border-bottom-color: var(--accent); }

    /* Form window dropdown */
    .form-window-wrap {
      display: flex; align-items: center; gap: 7px;
      font-size: 12px; color: var(--muted); font-family: var(--mono);
    }
    #form-window-select {
      background: var(--surface2);
      border: 1px solid var(--border2);
      border-radius: var(--radius);
      color: var(--text);
      font-family: var(--mono);
      font-size: 12px;
      padding: 3px 7px;
      cursor: pointer;
      outline: none;
      transition: border-color 0.15s;
    }
    #form-window-select:hover,
    #form-window-select:focus { border-color: var(--accent); }

    /* Testing toggle */
    .toggle-wrap {
      display: flex; align-items: center; gap: 8px;
      margin-left: 0; padding: 0 0 1px 0;
      font-size: 12px; color: var(--muted); font-family: var(--mono);
      cursor: pointer; user-select: none;
    }
    .toggle-wrap:hover { color: var(--text); }
    .toggle-track {
      position: relative; width: 32px; height: 18px;
      background: var(--border2); border-radius: 9px;
      transition: background 0.2s; flex-shrink: 0;
    }
    .toggle-track.on { background: var(--accent); }
    .toggle-thumb {
      position: absolute; top: 3px; left: 3px;
      width: 12px; height: 12px; border-radius: 50%;
      background: #fff; transition: left 0.2s;
    }
    .toggle-track.on .toggle-thumb { left: 17px; background: var(--accent-fg); }

    /* Testing date picker */
    .testing-date-wrap {
      display: flex; align-items: center; gap: 7px;
      margin-left: 12px; padding-left: 12px;
      border-left: 1px solid var(--border2);
      font-size: 12px; color: var(--muted); font-family: var(--mono);
    }
    .testing-date-wrap label { white-space: nowrap; }
    #testing-date {
      background: var(--surface2);
      border: 1px solid var(--border2);
      border-radius: var(--radius);
      color: var(--text);
      font-family: var(--mono);
      font-size: 12px;
      padding: 3px 7px;
      cursor: pointer;
      outline: none;
      transition: border-color 0.15s;
    }
    #testing-date:hover, #testing-date:focus { border-color: var(--accent); }
    #testing-date::-webkit-calendar-picker-indicator { filter: invert(0.6); cursor: pointer; }
    #testing-apply {
      padding: 3px 10px;
      background: var(--accent);
      color: var(--accent-fg);
      border: none;
      border-radius: var(--radius);
      font-family: var(--mono);
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      transition: opacity 0.15s;
    }
    #testing-apply:hover { opacity: 0.85; }

    /* League tabs */
    .tabs {
      display: flex;
      gap: 16px;
      margin-bottom: 0.75rem;
      flex-wrap: wrap;
      align-items: flex-start;
    }
    .tab-group { display: flex; flex-direction: column; gap: 5px; }

    .tab-group-btns { display: flex; gap: 4px; flex-wrap: wrap; }
    .tab {
      padding: 5px 13px;
      border-radius: var(--radius);
      border: 1px solid var(--border);
      background: transparent;
      color: var(--muted);
      font-size: 12px;
      font-family: var(--font);
      cursor: pointer;
      transition: all 0.12s;
      white-space: nowrap;
    }
    .tab:hover { border-color: var(--border2); color: var(--text); }
    .tab.active {
      background: var(--accent); color: var(--accent-fg);
      border-color: var(--accent); font-weight: 600;
    }

    /* Legend */
    .legend {
      display: flex; flex-wrap: wrap;
      gap: 8px 16px; margin-bottom: 1.25rem; min-height: 22px;
    }
    .legend-item { display: flex; align-items: center; gap: 6px; font-size: 12px; color: var(--muted); font-family: var(--mono); }
    .swatch { width: 8px; height: 8px; border-radius: 2px; flex-shrink: 0; }

    /* Table */
    .table-wrap { overflow-x: auto; }
    table { width: 100%; border-collapse: collapse; font-size: 13px; table-layout: auto; }
    th {
      text-align: left; padding: 7px 10px;
      color: var(--muted); font-weight: 400; font-size: 11px;
      font-family: var(--mono); letter-spacing: 0.06em; text-transform: uppercase;
      border-bottom: 1px solid var(--border); white-space: nowrap;
    }
    th.r, td.r { text-align: right; }
    td {
      padding: 5px 10px; border-bottom: 1px solid var(--border);
      vertical-align: middle; white-space: nowrap;
      overflow: hidden; text-overflow: ellipsis; max-width: 0;
    }
    td.col-odds { overflow: visible; white-space: nowrap; max-width: none; }
    tr:last-child td { border-bottom: none; }
    tr:hover td { background: var(--surface2); }

    .col-rank { width: 42px; }
    .col-team { width: 170px; min-width: 130px; }
    .col-pts  { width: 44px; }
    .col-wdl  { width: 36px; }
    .col-form { width: 100px; }
    .col-fix  { width: auto; white-space: nowrap; }
    .col-odds { width: 130px; min-width: 120px; white-space: nowrap; }
    .flag-icon {
      width: 16px; height: 12px; object-fit: cover;
      border-radius: 2px; vertical-align: middle; margin-right: 5px;
      box-shadow: 0 0 0 1px rgba(255,255,255,0.08);
    }
    .tab.tab-unloaded {
      opacity: 0.4;
      filter: grayscale(0.6);
    }
    .tab.tab-unloaded:hover { opacity: 0.65; }

    .rank     { color: var(--muted); font-family: var(--mono); font-size: 11px; }
    .team-name{ font-weight: 500; color: var(--text); }
    .pts-val  { font-family: var(--mono); font-weight: 600; color: var(--accent); }
    .wdl-val  { font-family: var(--mono); color: var(--muted); font-size: 12px; }

    /* Form dots */
    .dots { display: flex; gap: 3px; align-items: center; }
    .dot { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; }
    .dot-w { background: var(--win); }
    .dot-d { background: var(--draw); }
    .dot-l { background: var(--loss); }

    /* Odds pill */
    .odds-wrap {
      display: inline-flex; align-items: center; gap: 4px;
      font-family: var(--mono); font-size: 11px; margin-left: 4px;
    }
    .odds-pill {
      padding: 1px 5px; border-radius: 3px;
      border: 1px solid var(--border2);
      background: var(--surface2); color: var(--muted);
      white-space: nowrap;
    }
    .odds-label { font-size: 10px; color: var(--muted); opacity: 0.7; }

    /* Result pill */
    .fix-result {
      display: inline-flex; align-items: center; gap: 5px;
      font-family: var(--mono); font-size: 11px; font-weight: 600;
      white-space: nowrap;
    }
    .fix-result-score {
      padding: 1px 6px; border-radius: 4px;
      background: var(--surface2); border: 1px solid var(--border2);
      color: var(--text); letter-spacing: 0.04em;
    }
    .fix-result-winner { color: var(--accent); font-size: 11px; }
    .fix-result-draw   { color: var(--muted);  font-size: 11px; }

    /* Fixture badge */
    .fix-badge {
      display: inline-flex; align-items: center; gap: 6px;
      padding: 3px 8px; border-radius: 20px;
      font-size: 11px; font-family: var(--mono); font-weight: 500;
      white-space: nowrap; border: 1px solid transparent;
    }
    .fix-ha { font-size: 10px; opacity: 0.7; font-weight: 400; }

    /* Form key */

    /* Best Bets */
    .bets-header {
      font-size: 12px; color: var(--muted); margin-bottom: 1.5rem; line-height: 1.7;
      border-left: 2px solid var(--border2); padding-left: 10px;
    }
    .bets-loading { padding: 2rem 0; color: var(--muted); font-size: 13px; display: flex; align-items: center; gap: 8px; }
    .bets-empty   { padding: 2rem 0; color: var(--muted); font-size: 13px; }
    .bet-card {
      display: grid;
      grid-template-columns: 1fr auto;
      grid-template-rows: auto auto;
      gap: 5px 16px;
      align-items: center;
      padding: 14px 14px 14px 16px;
      border: 1px solid var(--border);
      border-left: 3px solid var(--accent);
      border-radius: var(--radius-lg);
      margin-bottom: 10px;
      background: var(--surface);
      transition: background 0.12s;
    }
    .bet-card:hover { background: var(--surface2); }
    .bet-matchup {
      font-size: 14px; font-weight: 600; color: var(--text);
      display: flex; align-items: center; gap: 10px; flex-wrap: wrap;
      grid-column: 1; grid-row: 1;
    }
    .bet-away { color: var(--muted); font-weight: 400; }
    .bet-vs   { font-size: 11px; color: var(--muted); font-weight: 400; }
    .bet-meta {
      display: flex; gap: 10px; font-size: 12px; color: var(--muted);
      font-family: var(--mono); flex-wrap: wrap; align-items: center;
      grid-column: 1; grid-row: 2;
    }
    .bet-right {
      grid-column: 2; grid-row: 1 / 3;
      display: flex; flex-direction: column; align-items: flex-end; gap: 5px;
    }
    .bet-league { font-size: 11px; color: var(--muted); font-family: var(--mono); white-space: nowrap; }
    .bet-diff {
      display: inline-block; padding: 2px 8px;
      background: rgba(200,240,74,0.12); border: 1px solid rgba(200,240,74,0.25);
      border-radius: 20px; font-size: 11px; font-family: var(--mono); color: var(--accent);
      white-space: nowrap;
    }
    .bet-dots { display: flex; gap: 3px; align-items: center; }

    /* Date section separator */
    .bet-date-section { margin: 1.25rem 0 0.5rem; }
    .bet-date-heading {
      font-size: 11px; font-family: var(--mono); letter-spacing: 0.08em;
      text-transform: uppercase; color: var(--muted);
      border-bottom: 1px solid var(--border); padding-bottom: 4px; margin-bottom: 8px;
    }

    /* Analytics */
    .bets-analytics {
      margin-top: 1.5rem;
      border: 1px solid var(--border2);
      border-radius: var(--radius-lg);
      padding: 14px 16px;
      background: var(--surface);
    }
    .bets-analytics-title {
      font-size: 11px; font-family: var(--mono); letter-spacing: 0.08em;
      text-transform: uppercase; color: var(--muted); margin-bottom: 10px;
    }
    .bets-analytics-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
      gap: 10px;
    }
    .bets-stat {
      display: flex; flex-direction: column; gap: 2px;
    }
    .bets-stat-val {
      font-size: 22px; font-weight: 700; color: var(--accent); font-family: var(--font);
    }
    .bets-stat-label {
      font-size: 11px; color: var(--muted); font-family: var(--mono);
    }
    .bets-stat-sub {
      font-size: 11px; color: var(--muted); font-family: var(--mono);
    }

    /* Status / error */
    .status {
      padding: 2rem 0; color: var(--muted); font-size: 13px;
      display: flex; align-items: center; gap: 8px;
    }
    .spinner {
      width: 14px; height: 14px;
      border: 2px solid var(--border2); border-top-color: var(--accent);
      border-radius: 50%; animation: spin 0.7s linear infinite; flex-shrink: 0;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .error {
      padding: 1rem; border: 1px solid rgba(248,113,113,0.3);
      border-radius: var(--radius-lg); color: var(--loss);
      font-size: 13px; background: rgba(248,113,113,0.05);
    }

    /* Footer */
    footer {
      border-top: 1px solid var(--border);
      padding: 1rem 2rem; font-size: 11px; color: var(--muted);
      font-family: var(--mono); display: flex;
      justify-content: space-between; flex-wrap: wrap; gap: 4px;
    }

    /* Responsive */
    @media (max-width: 600px) {
      header { padding: 1rem; }
      .container { padding: 1rem 1rem 3rem; }
      footer { padding: 1rem; }
      .col-team { width: 120px; }
      .col-wdl  { display: none; }
      .bet-right { display: none; }
    }
    @media (prefers-reduced-motion: reduce) {
      .spinner { animation: none; opacity: 0.5; }
    }
  </style>
</head>

</header>

    <div id="bets-content">

</main>

<footer>
  <span>Data: football-data.org</span>
  <span id="last-updated"></span>

<script>
const BASE     = 'https://football-proxy.bensturgess83.workers.dev';

const oddsCache = {};

async function fetchOddsForDate(dateStr) {
  if (oddsCache[dateStr]) return oddsCache[dateStr];
  try {
    // Use v1 /api/events/ endpoint which has odds_home/draw/away as top-level fields
    // Route through Worker /bsd/ to avoid CORS
    const url = `${BASE}/bsd/events/?date=${dateStr}&limit=200`;
    const res = await fetch(url);
    if (!res.ok) { oddsCache[dateStr] = {}; return {}; }
    const data   = await res.json();
    const events = data.results || data.events || [];
    const map    = {};
    for (const e of events) {
      const homeTeam = (e.home_team || '').trim();
      const awayTeam = (e.away_team || '').trim();
      const hw = e.odds_home ?? null;
      const dr = e.odds_draw ?? null;
      const aw = e.odds_away ?? null;
      if (homeTeam && awayTeam && (hw || dr || aw)) {
        const key = (homeTeam + '|' + awayTeam).toLowerCase();
        map[key] = {
          home: hw != null ? parseFloat(hw).toFixed(2) : null,
          draw: dr != null ? parseFloat(dr).toFixed(2) : null,
          away: aw != null ? parseFloat(aw).toFixed(2) : null,
        };
      }
    }
    oddsCache[dateStr] = map;
    return map;
  } catch(err) { oddsCache[dateStr] = {}; return {}; }
}

// Sort: England, Spain, Germany, Italy first (in that order), then remaining countries A-Z; tier ascending within each country
const COUNTRY_PRIORITY = ['England', 'Spain', 'Germany', 'Italy'];
function countrySortKey(country) {
  const idx = COUNTRY_PRIORITY.indexOf(country);
  return idx === -1 ? COUNTRY_PRIORITY.length : idx;
}
ALL_LEAGUES.sort((a, b) => {
  const ap = countrySortKey(a.country), bp = countrySortKey(b.country);
  if (ap !== bp) return ap - bp;
  if (ap === COUNTRY_PRIORITY.length && a.country !== b.country) return a.country.localeCompare(b.country);
  return a.tier - b.tier;
});

// Global request queue — serialises ALL API calls with 7s minimum gap
// This is the single source of rate limiting; the Worker just proxies
let _lastApiCall  = 0;
let _apiQueue     = Promise.resolve();
let _preloadPaused = false;
let _queueGen     = 0; // incremented to cancel all pending queue entries

async function apiFetch(path, isPreload = false) {
  const gen = _queueGen;
  const result = await (_apiQueue = _apiQueue.then(async () => {
    if (isPreload && _preloadPaused) return null;
    if (_queueGen !== gen) return null; // cancelled by a newer action
    const now  = Date.now();
    const wait = Math.max(0, _lastApiCall + 7200 - now);
    if (wait > 0) await new Promise(r => setTimeout(r, wait));
    if (_queueGen !== gen) return null; // check again after wait
    _lastApiCall = Date.now();
    const res = await fetch(BASE + path);
    if (!res.ok) throw new Error(`API returned ${res.status} for ${path}`);
    return res.json();
  }));
  if (result === null) throw new Error('Request cancelled');
  return result;
}

function cancelPendingRequests() {
  _queueGen++;           // invalidate all queued entries
  _apiQueue = Promise.resolve(); // reset queue
  _preloadPaused = false;
}

// Raw match data cache (separate from processed cache so we can reprocess for different dates)

// Derive the season start year for a given date.
// European seasons typically kick off in late July, so July onwards = new season year.
function seasonYearForDate(date) {
  const yr = date.getFullYear();
  const mo = date.getMonth() + 1; // 1-indexed
  return mo >= 7 ? yr : yr - 1;
}

// ── API-Football integration ──
const afLeagueIdCache = {}; // afCountry+afName -> numeric league id

let _afApiQueue = Promise.resolve();
const AF_MIN_GAP_MS = 2500; // hard global gap — one request every 2.5s, no exceptions
let _lastAfCallAt = 0;

// Blocks until at least AF_MIN_GAP_MS has elapsed since the last call, regardless of source
async function afWaitForWindowSlot() {
  const now  = Date.now();
  const wait = Math.max(0, _lastAfCallAt + AF_MIN_GAP_MS - now);
  if (wait > 0) await new Promise(r => setTimeout(r, wait));
}

// Call API-Football directly from the browser — bypasses Cloudflare Workers'
// shared outbound IP range, which was triggering false rate-limit rejections.
// Key is visible in browser network traffic as a tradeoff for reliability.
const AF_DIRECT_BASE = 'https://v3.football.api-sports.io';
const AF_DIRECT_KEY  = '14a28ba58672d56406d41da434d85a8d';

async function afApiFetchOnce(path) {
  const res = await fetch(AF_DIRECT_BASE + path, {
    headers: { 'x-apisports-key': AF_DIRECT_KEY },
  });
  const remaining = res.headers.get('x-ratelimit-requests-remaining') || res.headers.get('x-ratelimit-remaining');
  const limit     = res.headers.get('x-ratelimit-requests-limit')     || res.headers.get('x-ratelimit-limit');
  const allHeaders = {};
  res.headers.forEach((v, k) => { allHeaders[k] = v; });
  const bodyText = await res.text();
  let json;
  try { json = JSON.parse(bodyText); } catch { json = null; }
  if (!res.ok) {
    throw new Error(`API-Football returned ${res.status} for ${path}`);
  }
  if (json && json.errors && Object.keys(json.errors).length > 0) {
    const msg = Object.values(json.errors).join('; ');
    const err = new Error(`API-Football error: ${msg}`);
    err.isRateLimit = msg.toLowerCase().includes('too many requests') || msg.toLowerCase().includes('rate');
    throw err;
  }
  return json;
}

async function afApiFetch(path, isPreload = false) {
  const result = await (_afApiQueue = _afApiQueue.then(async () => {
    if (isPreload && _preloadPaused) return null;
    await afWaitForWindowSlot();
    if (isPreload && _preloadPaused) return null;
    _lastAfCallAt = Date.now();
    let attempt = 0;
    const maxAttempts = 5;
    while (true) {
      try {
        return await afApiFetchOnce(path);
      } catch (e) {
        if (e.isRateLimit && attempt < maxAttempts) {
          attempt++;
          const backoff = Math.min(1000 * Math.pow(2, attempt - 1), 15000); // 1s, 2s, 4s, 8s, 15s
          await new Promise(r => setTimeout(r, backoff));
          _lastAfCallAt = Date.now();
          continue;
        }
        throw e;
      }
    }
  }));
  if (result === null) throw new Error('Request cancelled');
  return result;
}

const _inFlightLeagueId = {}; // dedupe concurrent resolveAfLeagueId calls for the same league

async function resolveAfLeagueId(afName, afCountry) {
  const key = afCountry + '|' + afName;
  if (afLeagueIdCache[key]) return afLeagueIdCache[key];
  if (_inFlightLeagueId[key]) return _inFlightLeagueId[key];

  const p = (async () => {
    try {
      const data = await afApiFetch(`/leagues?name=${encodeURIComponent(afName)}&country=${encodeURIComponent(afCountry)}`);
      const match = (data.response || [])[0];
      if (!match) throw new Error(`Could not resolve league id for ${afName} (${afCountry})`);
      afLeagueIdCache[key] = match.league.id;
      return match.league.id;
    } finally {
      delete _inFlightLeagueId[key];
    }
  })();
  _inFlightLeagueId[key] = p;
  return p;
}

// Normalize API-Football standings + fixtures into the same shape football-data.org uses
async function fetchRawApiFootball(leagueDef, asOf, isPreload) {
  const season = seasonYearForDate(asOf);
  const leagueId = await resolveAfLeagueId(leagueDef.afName, leagueDef.afCountry);

  const standRes = await afApiFetch(`/standings?league=${leagueId}&season=${season}`, isPreload);
  const standingsGroup = standRes.response?.[0]?.league?.standings?.[0] || [];
  if (standingsGroup.length === 0) {
    throw new Error(`No standings data for ${leagueDef.label} season ${season}`);
  }

  const fixRes = await afApiFetch(`/fixtures?league=${leagueId}&season=${season}`, isPreload);
  // Normalize standings into football-data.org shape: { standings: [{ table: [...] }] }
  const standData = {
    standings: [{
      table: standingsGroup.map(row => ({
        position: row.rank,
        team: { id: row.team.id, name: row.team.name, shortName: row.team.name },
        playedGames: row.all.played,
        won: row.all.win,
        draw: row.all.draw,
        lost: row.all.lose,
        points: row.points,
      })),
    }],
  };

  // Normalize fixtures into football-data.org match shape
  const matches = (fixRes.response || []).map(f => ({
    id: f.fixture.id,
    utcDate: f.fixture.date,
    status: f.fixture.status.short === 'FT' || f.fixture.status.short === 'AET' || f.fixture.status.short === 'PEN' ? 'FINISHED' : 'SCHEDULED',
    homeTeam: { id: f.teams.home.id, shortName: f.teams.home.name },
    awayTeam: { id: f.teams.away.id, shortName: f.teams.away.name },
    score: {
      fullTime: {
        home: f.goals.home,
        away: f.goals.away,
      },
    },
  }));

  return { standData, allMatchData: { matches } };
}

const _inFlightRaw = {}; // dedupe concurrent fetchRaw calls for the same code+season

async function fetchRaw(code, asOf, isPreload = false) {
  const season   = seasonYearForDate(asOf);
  const cacheKey = code + '_s' + season;
  if (rawCache[cacheKey]) return rawCache[cacheKey];
  if (_inFlightRaw[cacheKey]) return _inFlightRaw[cacheKey];

  const leagueDef = LEAGUES.find(l => l.code === code);

  // API-Football path — different provider, different fetch/normalize logic
  if (leagueDef && leagueDef.provider === 'af') {
    const p = (async () => {
      try {
        const data = await fetchRawApiFootball(leagueDef, asOf, isPreload);
        rawCache[cacheKey] = data;
        return rawCache[cacheKey];
      } catch (e) {
        throw new Error(`Could not load data for ${code}: ${e.message}`);
      } finally {
        delete _inFlightRaw[cacheKey];
      }
    })();
    _inFlightRaw[cacheKey] = p;
    return p;
  }

  // Always fetch the derived season — don't fall back, even if no finished matches yet.
  // In pre-season (e.g. July) the new season has only scheduled matches; that's correct.
  // For test mode with a historical date, the derived season will have finished matches.
  let standData, allMatchData;
  try {
    standData    = await apiFetch(`/competitions/${code}/standings?season=${season}`, isPreload);
    allMatchData = await apiFetch(`/competitions/${code}/matches?season=${season}`, isPreload);
  } catch(e) {
    // If the season isn't available yet, try the previous one as a last resort
    try {
      standData    = await apiFetch(`/competitions/${code}/standings?season=${season - 1}`, isPreload);
      allMatchData = await apiFetch(`/competitions/${code}/matches?season=${season - 1}`, isPreload);
    } catch(e2) {
      throw new Error(`Could not load data for ${code}: ${e2.message}`);
    }
  }

  rawCache[cacheKey] = { standData, allMatchData };
  return rawCache[cacheKey];
}

const _inFlightLoads = {}; // dedupe concurrent loadLeague calls for the same cacheKey

async function loadLeague(code, asOfDate, isPreload = false) {
  const asOf     = asOfDate instanceof Date ? asOfDate : getAsOfDate();
  const cacheKey = code + '_' + asOf.toISOString().slice(0, 10) + '_w' + formWindow;
  if (cache[cacheKey]) return cache[cacheKey];

  // If this exact league+date is already loading, wait for that call instead of starting a new one
  if (_inFlightLoads[cacheKey]) return _inFlightLoads[cacheKey];

  const loadPromise = (async () => {
    const { standData, allMatchData } = await fetchRaw(code, asOf, isPreload);
  const allMatches = allMatchData.matches || [];

  // Build team list from standings (for names/ids) but recalculate all stats from match history
  const teams = standData.standings[0].table.map(row => ({
    id:      row.team.id,
    name:    row.team.shortName || row.team.name,
    pts:     0,   // will be recalculated from matches
    played:  0,
    won:     0,
    drawn:   0,
    lost:    0,
    gf:      0,
    ga:      0,
    results: [],
    formPts: 0,
    formW:   0,
    formD:   0,
    formL:   0,
  }));

  const teamMap = Object.fromEntries(teams.map(t => [t.id, t]));

  // All finished matches up to asOf — sorted newest first for form, oldest first for standings
  const finishedBeforeAsOf = allMatches
    .filter(m => m.status === 'FINISHED' && new Date(m.utcDate) <= asOf)
    .sort((a, b) => new Date(b.utcDate) - new Date(a.utcDate));

  // Rebuild full season standings from match history
  for (const m of finishedBeforeAsOf) {
    const h  = teamMap[m.homeTeam.id];
    const a  = teamMap[m.awayTeam.id];
    const hg = m.score?.fullTime?.home;
    const ag = m.score?.fullTime?.away;
    if (!h || !a || hg === null || hg === undefined) continue;

    h.played++; a.played++;
    h.gf += hg; h.ga += ag;
    a.gf += ag; a.ga += hg;

    if (hg > ag)      { h.won++;   h.pts += 3; a.lost++; }
    else if (hg < ag) { a.won++;   a.pts += 3; h.lost++; }
    else              { h.drawn++; h.pts += 1; a.drawn++; a.pts += 1; }

    // Last 8 form (array is already newest-first due to sort)
    if (h.results.length < formWindow) h.results.push(hg > ag ? 'W' : hg < ag ? 'L' : 'D');
    if (a.results.length < formWindow) a.results.push(ag > hg ? 'W' : ag < hg ? 'L' : 'D');
  }

  for (const t of teams) {
    for (const r of t.results) {
      if (r === 'W') { t.formPts += 3; t.formW++; }
      else if (r === 'D') { t.formPts += 1; t.formD++; }
      else t.formL++;
    }
  }

  // Next fixture for each team: first match after asOf (any status — may now be finished)
  const upcoming = allMatches
    .filter(m => new Date(m.utcDate) > asOf)
    .sort((a, b) => new Date(a.utcDate) - new Date(b.utcDate));

  // Build a lookup of finished results by team pair
  const resultByPair = {};
  for (const m of allMatches) {
    if (m.status !== 'FINISHED') continue;
    const hg = m.score?.fullTime?.home;
    const ag = m.score?.fullTime?.away;
    if (hg === null || hg === undefined) continue;
    const key = [m.homeTeam.id, m.awayTeam.id].join('-');
    resultByPair[key] = { hg, ag, homeId: m.homeTeam.id, awayId: m.awayTeam.id };
  }

  const nextRound = {};
  const seen = new Set();
  for (const m of upcoming) {
    const hid = m.homeTeam.id, aid = m.awayTeam.id;
    if (seen.has(hid) || seen.has(aid)) continue;
    if (teamMap[hid] && teamMap[aid]) {
      // Check if this match has since been played (status FINISHED)
      const resultKey = [hid, aid].join('-');
      const result = m.status === 'FINISHED' ? resultByPair[resultKey] : null;
      const entry = { opp: aid, home: true,  date: m.utcDate, result };
      nextRound[hid] = entry;
      nextRound[aid] = { opp: hid, home: false, date: m.utcDate, result };
      seen.add(hid); seen.add(aid);
    }
  }

  // Odds are fetched lazily by render() when a league is actually viewed —
  // not during preload, to avoid competing with the API-Football request queue
  const oddsMap = {};
    const data = { teams, teamMap, nextRound, fetched: new Date(), asOf, oddsMap };
    cache[cacheKey] = data;
    return data;
  })();

  _inFlightLoads[cacheKey] = loadPromise;
  try {
    return await loadPromise;
  } finally {
    delete _inFlightLoads[cacheKey];
  }
}

/* ── Odds HTML helper ── */
function oddsHtml(oddsMap, homeTeamName, awayTeamName) {
  if (!oddsMap || !Object.keys(oddsMap).length) return '';
  const hLow = homeTeamName.toLowerCase();
  const aLow = awayTeamName.toLowerCase();
  // Try exact match first, then partial match on both team names
  let o = oddsMap[hLow + '|' + aLow];
  if (!o) {
    const k = Object.keys(oddsMap).find(key => {
      const [h, a] = key.split('|');
      return (h.includes(hLow) || hLow.includes(h)) &&
             (a.includes(aLow) || aLow.includes(a));
    });
    if (k) o = oddsMap[k];
  }
  if (!o || (!o.home && !o.draw && !o.away)) return '';
  const parts = [];
  if (o.home) parts.push(`<span class="odds-pill"><span class="odds-label">H</span> ${o.home}</span>`);
  if (o.draw) parts.push(`<span class="odds-pill"><span class="odds-label">D</span> ${o.draw}</span>`);
  if (o.away) parts.push(`<span class="odds-pill"><span class="odds-label">A</span> ${o.away}</span>`);
  return parts.length ? `<span class="odds-wrap">${parts.join('')}</span>` : '';
}

/* ── Result HTML helper ── */
function resultHtml(fix, teamId, teamMap) {
  if (!fix || !fix.result) return '';
  const r   = fix.result;
  const hg  = r.hg, ag = r.ag;
  const isHome = fix.home;
  const myScore  = isHome ? hg : ag;
  const oppScore = isHome ? ag : hg;
  let winnerHtml;
  if (hg > ag) {
    const winnerName = teamMap[r.homeId]?.name || '';
    winnerHtml = isHome
      ? `<span class="fix-result-winner">W</span>`
      : `<span class="fix-result-draw">L</span>`;
  } else if (ag > hg) {
    winnerHtml = isHome
      ? `<span class="fix-result-draw">L</span>`
      : `<span class="fix-result-winner">W</span>`;
  } else {
    winnerHtml = `<span class="fix-result-draw">D</span>`;
  }
  return `<span class="fix-result">
    ${winnerHtml}
    <span class="fix-result-score">${hg} – ${ag}</span>
  </span>`;
}

/* ── League table renderer ── */
function render(code, data) {
  updateFormKeyLabel();
  const { teams, teamMap, nextRound } = data;

  // Lazily fetch odds for this league's fixture dates only when actually viewed,
  // then re-render once available — keeps odds fetching off the critical preload path
  if (!data.oddsFetched) {
    data.oddsFetched = true;
    const fixtureDates = [...new Set(Object.values(nextRound).map(f => new Date(f.date).toISOString().slice(0, 10)))];
    (async () => {
      for (const d of fixtureDates) {
        try {
          const m = await fetchOddsForDate(d);
          Object.assign(data.oddsMap, m);
        } catch { /* odds are best-effort */ }
      }
      if (currentLeague === code) render(code, data); // refresh view with odds now filled in
    })();
  }
  const sorted = [...teams].sort((a, b) => b.formPts - a.formPts || b.pts - a.pts);

  const pairColor   = {};
  const legendPairs = [];
  const usedPairs   = new Set();
  let ci = 0;

  // Only colour top 3 + their opponents, and bottom 3 + their opponents
  const n        = sorted.length;
  const top3ids  = new Set(sorted.slice(0, 3).map(t => t.id));
  const bot3ids  = new Set(sorted.slice(Math.max(0, n - 3)).map(t => t.id));
  const priority = new Set([...top3ids, ...bot3ids]);

  // Identify best bets: top3 team whose next fixture is vs bottom3
  const bestBetIds = new Set();
  for (const t of sorted) {
    const fix = nextRound[t.id];
    if (!fix) continue;
    if (top3ids.has(t.id) && bot3ids.has(fix.opp)) bestBetIds.add(t.id);
    if (bot3ids.has(t.id) && top3ids.has(fix.opp) && nextRound[fix.opp]?.opp === t.id) {
      // The opponent (top3) is the best bet — mark them too so the icon shows on their row
    }
  }

  // First pass: pairs where at least one team is in top3 or bottom3
  for (const [tidStr, fix] of Object.entries(nextRound)) {
    const tid = +tidStr;
    if (!priority.has(tid)) continue;
    const key = [tid, fix.opp].sort().join('-');
    if (usedPairs.has(key)) continue;
    usedPairs.add(key);
    const c = PAIR_COLORS[ci % PAIR_COLORS.length];
    pairColor[tid]     = c;
    pairColor[fix.opp] = c;
    const t1 = teamMap[tid], t2 = teamMap[fix.opp];
    if (t1 && t2) legendPairs.push({ label: `${t1.name} v ${t2.name}`, c });
    ci++;
  }



  const rows = sorted.map((t, i) => {
    const dots = [...t.results].reverse().map(r => {
      const cls   = r === 'W' ? 'dot-w' : r === 'D' ? 'dot-d' : 'dot-l';
      const label = r === 'W' ? 'Win'   : r === 'D' ? 'Draw'  : 'Loss';
      return `<span class="dot ${cls}" title="${label}"></span>`;
    }).join('');

    let badge = '<span style="color:var(--muted)">—</span>';
    const fix = nextRound[t.id];
    const c   = pairColor[t.id];
    const opp = fix ? teamMap[fix.opp] : null;
    if (fix && c && opp) {
      const ha      = fix.home ? 'H' : 'A';
      const dateStr = new Date(fix.date).toLocaleDateString('en-GB', { day: 'numeric', month: 'short' });
      const resHtml = resultHtml(fix, t.id, teamMap);
      badge = `<span class="fix-badge" style="background:${c.bg};border-color:${c.border};color:${c.text}">
          <span class="fix-ha">${ha}</span>${opp.name}<span class="fix-ha">· ${dateStr}</span>
        </span>${resHtml ? ' ' + resHtml : ''}`;
    }

      <td class="col-odds">${fix && opp && c ? oddsHtml(data.oddsMap, fix.home ? t.name : opp.name, fix.home ? opp.name : t.name) : ''}</td>
    </tr>`;
  }).join('');

  document.getElementById('content').innerHTML = `
    <div class="table-wrap">
      <table>
        <thead><tr>
          <th class="col-rank">#</th>
          <th class="col-team">Team</th>
          <th class="col-pts r" title="Form points from last 8 matches">Pts</th>
          <th class="col-wdl r">W</th>
          <th class="col-wdl r">D</th>
          <th class="col-wdl r">L</th>
          <th class="col-form" id="form-col-header">Last 8</th>
          <th class="col-fix">Next fixture</th>
          <th class="col-odds">Odds</th>
        </tr></thead>

      </table>

  const today = new Date().toISOString().slice(0, 10);
  const dataDay = data.asOf.toISOString().slice(0, 10);
  const asOfLabel = dataDay !== today
    ? ' · As of ' + data.asOf.toLocaleDateString('en-GB', { day: 'numeric', month: 'short', year: 'numeric' })
    : '';
  document.getElementById('last-updated').textContent =
    'Updated ' + data.fetched.toLocaleTimeString('en-GB', { hour: '2-digit', minute: '2-digit' }) + asOfLabel;

/* ── Analytics HTML builder ── */
function analyticsHtml(bets) {
  const total = bets.length;
  if (total === 0) return '';
  const pct = (n, d) => d > 0 ? Math.round(n / d * 100) : 0;

  // Overall stats
  let winners = 0, homeWins = 0, awayWins = 0, totalHome = 0, totalAway = 0;
  const byLeague = {};
  for (const b of bets) {
    if (b.isHome) totalHome++; else totalAway++;
    if (!byLeague[b.leagueLabel]) byLeague[b.leagueLabel] = { total: 0, wins: 0, withRes: 0 };
    byLeague[b.leagueLabel].total++;
    if (b.fix?.result) {
      const r = b.fix.result;
      const qualWon = b.isHome ? r.hg > r.ag : r.ag > r.hg;
      byLeague[b.leagueLabel].withRes++;
      if (qualWon) {
        winners++;
        byLeague[b.leagueLabel].wins++;
        if (b.isHome) homeWins++; else awayWins++;
      }
    }
  }
  const withRes = bets.filter(b => b.fix?.result).length;

  // Per-league table rows
  const leagueRows = Object.entries(byLeague)
    .sort((a, b) => b[1].wins - a[1].wins)
    .map(([label, s]) => `
      <tr>
        <td style="padding:4px 8px;font-size:12px;color:var(--text)">${label}</td>
        <td style="padding:4px 8px;font-size:12px;text-align:right;font-family:var(--mono);color:var(--muted)">${s.total}</td>
        <td style="padding:4px 8px;font-size:12px;text-align:right;font-family:var(--mono);color:var(--accent)">${s.wins}</td>
        <td style="padding:4px 8px;font-size:12px;text-align:right;font-family:var(--mono);color:var(--muted)">${pct(s.wins, s.withRes)}%</td>
      </tr>`).join('');

  // By-month breakdown
  const byMonth = {};
  for (const b of bets) {
    if (!b.fixDay) continue;
    const monthKey = b.fixDay.slice(0, 7); // YYYY-MM
    if (!byMonth[monthKey]) byMonth[monthKey] = { total: 0, wins: 0, withRes: 0 };
    byMonth[monthKey].total++;
    if (b.fix?.result) {
      const r = b.fix.result;
      const qualWon = b.isHome ? r.hg > r.ag : r.ag > r.hg;
      byMonth[monthKey].withRes++;
      if (qualWon) byMonth[monthKey].wins++;
    }
  }
  const monthNames = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
  const monthRows = Object.keys(byMonth).sort().map(mk => {
    const s    = byMonth[mk];
    const [yr, mo] = mk.split('-');
    const label = monthNames[parseInt(mo) - 1] + ' ' + yr;
    return `
      <tr>
        <td style="padding:4px 8px;font-size:12px;color:var(--text)">${label}</td>
        <td style="padding:4px 8px;font-size:12px;text-align:right;font-family:var(--mono);color:var(--muted)">${s.total}</td>
        <td style="padding:4px 8px;font-size:12px;text-align:right;font-family:var(--mono);color:var(--accent)">${s.wins}</td>
        <td style="padding:4px 8px;font-size:12px;text-align:right;font-family:var(--mono);color:var(--muted)">${pct(s.wins, s.withRes)}%</td>
      </tr>`;
  }).join('');

  const thStyle = 'padding:4px 8px;font-size:10px;font-family:var(--mono);color:var(--muted);letter-spacing:0.06em;text-transform:uppercase';
  const tableHtml = (rows) => `
    <table style="width:100%;border-collapse:collapse">
      <thead><tr style="border-bottom:1px solid var(--border)">
        <th style="${thStyle};text-align:left">League</th>
        <th style="${thStyle};text-align:right">Bets</th>
        <th style="${thStyle};text-align:right">Wins</th>
        <th style="${thStyle};text-align:right">Win %</th>
      </tr></thead>
      <tbody>${rows}</tbody>
    </table>`;

  return `
  <div class="bets-analytics">
    <div class="bets-analytics-title">Analytics · ${withRes} of ${total} bets have results</div>
    <div class="bets-analytics-grid">
      <div class="bets-stat">
        <span class="bets-stat-val">${total}</span>
        <span class="bets-stat-label">Total Best Bets</span>
        <span class="bets-stat-sub">${totalHome} home · ${totalAway} away</span>
      </div>
      <div class="bets-stat">
        <span class="bets-stat-val">${winners}</span>
        <span class="bets-stat-label">Total Winners</span>
        <span class="bets-stat-sub">${pct(winners, withRes)}% of bets with results</span>
      </div>
      <div class="bets-stat">
        <span class="bets-stat-val">${homeWins}</span>
        <span class="bets-stat-label">Home Winners</span>
        <span class="bets-stat-sub">${pct(homeWins, totalHome)}% of home best bets</span>
      </div>
      <div class="bets-stat">
        <span class="bets-stat-val">${awayWins}</span>
        <span class="bets-stat-label">Away Winners</span>
        <span class="bets-stat-sub">${pct(awayWins, totalAway)}% of away best bets</span>
      </div>
    </div>
    <div style="margin-top:14px">
      <div style="font-size:10px;font-family:var(--mono);letter-spacing:0.06em;text-transform:uppercase;color:var(--muted);margin-bottom:6px">By League</div>
      ${tableHtml(leagueRows.replace('League', 'League'))}
    </div>
    <div style="margin-top:14px">
      <div style="font-size:10px;font-family:var(--mono);letter-spacing:0.06em;text-transform:uppercase;color:var(--muted);margin-bottom:6px">By Month</div>
      ${tableHtml(monthRows)}
    </div>
  </div>`;
}

/* ── Best Bets renderer (live mode) ── */
function renderBets(bets) {
  const formLabelEl = document.getElementById('bets-form-label');
  if (formLabelEl) formLabelEl.textContent = `last ${formWindow}`;
  const el = document.getElementById('bets-content');
  if (bets.length === 0) {
    el.innerHTML = '<p class="bets-empty">No matches found right now — check back closer to the next round of fixtures.</p>';
    return;
  }
  // Sort by pts diff descending in live mode
  bets.sort((a, b) => b.ptsDiff - a.ptsDiff);
  el.innerHTML = bets.map(betCardHtml).join('');
  document.getElementById('last-updated').textContent =
    'Updated ' + new Date().toLocaleTimeString('en-GB', { hour: '2-digit', minute: '2-digit' });
}

/* ── Best Bets renderer (date range / test mode) ── */
function renderBetsDateRange(betsByDate, fromDate, toDate) {
  const el = document.getElementById('bets-content');
  const allDates = Object.keys(betsByDate).sort();
  if (allDates.length === 0) {
    el.innerHTML = '<p class="bets-empty">No best bets found in this date range.</p>';
    return;
  }
  const allBets = allDates.flatMap(d => betsByDate[d]);
  let html = '';
  for (const dateKey of allDates) {
    const dayBets = betsByDate[dateKey].slice().sort((a, b) => b.ptsDiff - a.ptsDiff);
    const heading = new Date(dateKey + 'T12:00:00Z').toLocaleDateString('en-GB', { weekday: 'long', day: 'numeric', month: 'long', year: 'numeric' });
    html += `<div class="bet-date-section"><div class="bet-date-heading">${heading}</div>${dayBets.map(betCardHtml).join('')}</div>`;
  }
  html += analyticsHtml(allBets);
  el.innerHTML = html;
  document.getElementById('last-updated').textContent =
    'Updated ' + new Date().toLocaleTimeString('en-GB', { hour: '2-digit', minute: '2-digit' });
}

function pushRangeBet(betsByDate, m, qualTeam, opponent, isHome, sorted, teamMap, leagueLabel) {
  const fixDate  = new Date(m.utcDate);
  const fixDay   = fixDate.toISOString().slice(0, 10);
  const qualRank = sorted.findIndex(t => t.id === qualTeam.id) + 1;
  const oppRank  = sorted.findIndex(t => t.id === opponent.id) + 1;
  const ptsDiff  = qualTeam.formPts - opponent.formPts;
  const dateStr  = fixDate.toLocaleDateString('en-GB', { weekday: 'short', day: 'numeric', month: 'short' });
  const homeTeam = isHome ? qualTeam : opponent;
  const awayTeam = isHome ? opponent : qualTeam;
  const dots = [...qualTeam.results].reverse().map(r => {
    const cls = r === 'W' ? 'dot-w' : r === 'D' ? 'dot-d' : 'dot-l';
    return `<span class="dot ${cls}" title="${r}"></span>`;
  }).join('');
  // Build fix object matching the shape used elsewhere
  const hg = m.score?.fullTime?.home;
  const ag = m.score?.fullTime?.away;
  const result = (m.status === 'FINISHED' && hg !== null && hg !== undefined)
    ? { hg, ag, homeId: m.homeTeam.id, awayId: m.awayTeam.id }
    : null;
  const fix = { date: m.utcDate, home: isHome, opp: opponent.id, result };
  if (!betsByDate[fixDay]) betsByDate[fixDay] = [];
  // Avoid duplicates
  const key = fixDay + qualTeam.id;
  if (!betsByDate[fixDay].some(b => b._key === key)) {
    betsByDate[fixDay].push({ qualTeam, opponent, homeTeam, awayTeam, isHome, qualRank, oppRank, ptsDiff, dateStr, fixDay, dots, leagueLabel, fix, teamMap, oddsMap: {}, _key: key });
  }
}

async function loadBets() {
  _preloadPaused = true; // pause background preload while we run
  const el = document.getElementById('bets-content');
  const totalLeagues = LEAGUES.length;
  let loadedCount = 0;
  let needsFetch = LEAGUES.some(({ code }) => !Object.keys(rawCache).some(k => k.startsWith(code + '_s')));
  const updateProgress = () => {
    el.innerHTML = needsFetch
      ? `<div class="status"><span class="spinner"></span> Loading leagues… ${loadedCount}/${totalLeagues}</div>`
      : `<div class="status"><span class="spinner"></span> Calculating…</div>`;
  };
  updateProgress(); // always clear and show spinner before processing

  if (testingMode) {
    // Date range mode: load each league as-of the day BEFORE fromDate (form state at range start),
    // then find all fixtures within the range where top3 plays bottom3
    const fromVal = document.getElementById('bets-date-from').value;
    const toVal   = document.getElementById('bets-date-to').value;
    if (!fromVal || !toVal) {
      el.innerHTML = '<p class="bets-empty">Please select a From and To date.</p>';
      return;
    }
    const fromDate = new Date(fromVal + 'T00:00:00Z');
    const toDate   = new Date(toVal   + 'T23:59:59Z');
    // Snapshot these immediately before any async calls
    const fromDateSnap = new Date(fromDate);
    const toDateSnap   = new Date(toDate);
    if (fromDateSnap > toDateSnap) {
      el.innerHTML = '<p class="bets-empty">From date must be before To date.</p>';
      return;
    }

    const betsByDate = {};

    // Force-load ALL leagues before scanning — ensures complete results regardless of preload state
    const primeAsOf = new Date(fromDateSnap.getTime() - 1000);
    for (const { code } of LEAGUES) {
      const rawAlreadyCached = Object.keys(rawCache).some(k => k.startsWith(code + '_s'));
      if (!rawAlreadyCached) {
        try { await loadLeague(code, primeAsOf); } catch { /* silent fail */ }
      }
      loadedCount++;
      if (loadedCount < totalLeagues) updateProgress();
    }
    loadedCount = 0; // reset for display

    // For each league, scan fixtures in range using per-match form rebuild
    for (const { code, label } of LEAGUES) {

      // Gather ALL cached raw data for this league across all seasons
      // Sort by finished match count so the season with real data is used first for standData
      let allMatches = [];
      let standData  = null;
      const seenMatchIds = new Set();
      Object.keys(rawCache)
        .filter(k => k.startsWith(code + '_s'))
        .sort((a, b) => {
          const fa = (rawCache[a].allMatchData.matches || []).filter(m => m.status === 'FINISHED').length;
          const fb = (rawCache[b].allMatchData.matches || []).filter(m => m.status === 'FINISHED').length;
          return fb - fa;
        })
        .forEach(rk => {
          const rd = rawCache[rk];
          if (!standData) standData = rd.standData;
          (rd.allMatchData.matches || []).forEach(m => {
            if (!seenMatchIds.has(m.id)) {
              seenMatchIds.add(m.id);
              allMatches.push(m);
            }
          });
        });
      if (!standData || allMatches.length === 0) continue;

      // Filter matches that fall within the selected date range
      const rangeMatches = allMatches.filter(m => {
        const d = new Date(m.utcDate);
        return d >= fromDateSnap && d <= toDateSnap;
      });

      // For each match in range, recalculate form as-of the day before that match
      for (const m of rangeMatches) {
        const matchDate = new Date(m.utcDate);
        const dayBefore = new Date(matchDate.getTime() - 24 * 60 * 60 * 1000);
        dayBefore.setUTCHours(23, 59, 59, 999);

        // Build form table as of dayBefore from raw match history
        const teams = standData.standings[0].table.map(row => ({
          id:      row.team.id,
          name:    row.team.shortName || row.team.name,
          pts:     0, played: 0, won: 0, drawn: 0, lost: 0,
          results: [], formPts: 0, formW: 0, formD: 0, formL: 0,
        }));
        const teamMap = Object.fromEntries(teams.map(t => [t.id, t]));

        const finishedBefore = allMatches
          .filter(mx => mx.status === 'FINISHED' && new Date(mx.utcDate) <= dayBefore)
          .sort((a, b) => new Date(b.utcDate) - new Date(a.utcDate));

        for (const mx of finishedBefore) {
          const h = teamMap[mx.homeTeam.id], a = teamMap[mx.awayTeam.id];
          const hg = mx.score?.fullTime?.home, ag = mx.score?.fullTime?.away;
          if (!h || !a || hg === null || hg === undefined) continue;
          h.played++; a.played++;
          if (hg > ag)      { h.won++;   h.pts += 3; a.lost++; }
          else if (hg < ag) { a.won++;   a.pts += 3; h.lost++; }
          else              { h.drawn++; h.pts += 1; a.drawn++; a.pts += 1; }
          if (h.results.length < formWindow) h.results.push(hg > ag ? 'W' : hg < ag ? 'L' : 'D');
          if (a.results.length < formWindow) a.results.push(ag > hg ? 'W' : ag < hg ? 'L' : 'D');
        }
        for (const t of teams) {
          for (const r of t.results) {
            if (r === 'W') { t.formPts += 3; t.formW++; }
            else if (r === 'D') { t.formPts += 1; t.formD++; }
            else t.formL++;
          }
        }

        const allZeroForm = teams.every(t => t.formPts === 0);
        const sorted = [...teams].sort((a, b) =>
          allZeroForm ? b.pts - a.pts : b.formPts - a.formPts || b.pts - a.pts
        );
        const n = sorted.length;
        if (n < 6) continue;
        const top3Set    = new Set(sorted.slice(0, 3).map(t => t.id));
        const bottom3Set = new Set(sorted.slice(n - 3).map(t => t.id));

        const hid = m.homeTeam.id, aid = m.awayTeam.id;
        const home = teamMap[hid], away = teamMap[aid];
        if (!home || !away) continue;

        if (top3Set.has(hid) && bottom3Set.has(aid)) {
          pushRangeBet(betsByDate, m, home, away, true, sorted, teamMap, label);
        }
        if (top3Set.has(aid) && bottom3Set.has(hid)) {
          pushRangeBet(betsByDate, m, away, home, false, sorted, teamMap, label);
        }
      }
    }
    await new Promise(r => setTimeout(r, 50));
    renderBetsDateRange(betsByDate, fromDateSnap, toDateSnap);
    _preloadPaused = false; // resume background preload
  } else {
    // Live mode: single as-of date (today)
    const asOf = getAsOfDate();
    const cacheKey = (code) => code + '_' + asOf.toISOString().slice(0, 10) + '_w' + formWindow;
    const results = [];
    for (const { code, label } of LEAGUES) {
      try {
        const data = await loadLeague(code, asOf);
        results.push({ code, label, data });
      } catch {
        results.push({ code, label, data: null });
      }
      loadedCount++;
      if (loadedCount < totalLeagues) updateProgress();
    }
    renderBets(collectBets(results, asOf), false);
  _preloadPaused = false; // resume background preload
  }
}

// Extract qualifying bets from league data for a given asOf date
function collectBets(allLeagueData, asOf) {
  const bets = [];
  for (const { code, label, data } of allLeagueData) {
    if (!data) continue;
    const { teams, teamMap, nextRound } = data;
    const allZeroForm = teams.every(t => t.formPts === 0);
    const sorted = [...teams].sort((a, b) =>
      allZeroForm
        ? b.pts - a.pts   // pre-season: fall back to standings order
        : b.formPts - a.formPts || b.pts - a.pts
    );
    const n = sorted.length;
    if (n < 6) continue;
    const bottom3Set = new Set(sorted.slice(n - 3).map(t => t.id));
    const top3       = sorted.slice(0, 3);
    for (const qualTeam of top3) {
      const fix = nextRound[qualTeam.id];
      if (!fix) continue;
      if (!bottom3Set.has(fix.opp)) continue;
      const opponent = teamMap[fix.opp];
      if (!opponent) continue;
      const fixDate = new Date(fix.date);
      const fixDay  = fixDate.toISOString().slice(0, 10);
      const isHome  = fix.home;
      const qualRank = sorted.findIndex(t => t.id === qualTeam.id) + 1;
      const oppRank  = sorted.findIndex(t => t.id === opponent.id) + 1;
      const ptsDiff  = qualTeam.formPts - opponent.formPts;
      const dateStr  = fixDate.toLocaleDateString('en-GB', { weekday: 'short', day: 'numeric', month: 'short' });
      const dots = [...qualTeam.results].reverse().map(r => {
        const cls = r === 'W' ? 'dot-w' : r === 'D' ? 'dot-d' : 'dot-l';
        return `<span class="dot ${cls}" title="${r}"></span>`;
      }).join('');
      const homeTeam = isHome ? qualTeam : opponent;
      const awayTeam = isHome ? opponent : qualTeam;
      bets.push({ qualTeam, opponent, homeTeam, awayTeam, isHome, qualRank, oppRank, ptsDiff, dateStr, fixDay, dots, leagueLabel: label, code, fix, teamMap });
    }
  }
  return bets;
}

/* ── Sequential preload: the single source of truth for loading league data.
   Tabs never trigger their own fetch — clicking just waits for the preloader
   to reach that league in its fixed order. ── */
let _preloadToken = 0;
let _preloadTotal = LEAGUES.length;
let _preloadDoneCount = 0;
const _leagueWaiters = {}; // code -> array of callbacks fired when that league finishes (success or fail)
const _leagueErrors  = {}; // code -> error message, if the last load attempt failed

function currentCacheKeyFor(code, asOf) {
  return code + '_' + asOf.toISOString().slice(0, 10) + '_w' + formWindow;
}

function isLeagueLoaded(code, asOf) {
  return !!cache[currentCacheKeyFor(code, asOf)];
}

function updateTabLoadedStates() {
  const asOf = getLeaguesAsOf();
  document.querySelectorAll('.tab-group-btns .tab').forEach(t => {
    const loaded = isLeagueLoaded(t.dataset.code, asOf);
    t.classList.toggle('tab-unloaded', !loaded);
  });
}

function updateLoadingProgressDisplay() {
  const el = document.getElementById('content');
  if (!el || !el.dataset || el.dataset.waitingFor !== currentLeague) return;
  el.innerHTML = `<div class="status"><span class="spinner"></span> Loading ${_preloadDoneCount}/${_preloadTotal} leagues…</div>`;
}

function notifyLeagueSettled(code) {
  const waiters = _leagueWaiters[code];
  if (!waiters) return;
  delete _leagueWaiters[code];
  waiters.forEach(fn => fn());
}

async function preloadAllLeagues(asOfOverride) {
  const myToken = ++_preloadToken;
  const asOf = asOfOverride || getLeaguesAsOf();
  _preloadDoneCount = 0;
  updateLoadingProgressDisplay();

  for (const { code } of LEAGUES) {
    if (_preloadToken !== myToken) return; // superseded by a newer preload run (e.g. date changed)
    const cacheKey = currentCacheKeyFor(code, asOf);
    if (!cache[cacheKey]) {
      try {
        await loadLeague(code, asOf);
        delete _leagueErrors[code];
      } catch (e) {
        _leagueErrors[code] = e.message;
      }
    }
    if (_preloadToken !== myToken) return;
    _preloadDoneCount++;
    updateTabLoadedStates();
    updateLoadingProgressDisplay();
    notifyLeagueSettled(code);
  }
}

/* ── League switcher — never fetches directly, only renders what's loaded
     or shows a waiting screen until the preloader reaches it ── */
async function switchLeague(code) {
  currentLeague = code;
  document.querySelectorAll('.tab-group-btns .tab').forEach(t =>
    t.classList.toggle('active', t.dataset.code === code)
  );

  const asOf = getLeaguesAsOf();
  const cacheKey = currentCacheKeyFor(code, asOf);
  const contentEl = document.getElementById('content');

  if (cache[cacheKey]) {
    contentEl.dataset.waitingFor = '';
    render(code, cache[cacheKey]);
    return;
  }

  if (_leagueErrors[code]) {
    contentEl.dataset.waitingFor = '';
    contentEl.innerHTML = `<div class="error"><strong>Couldn't load data.</strong><br>${_leagueErrors[code]}</div>`;
    return;
  }

  // Not loaded yet — show progress and wait for the preloader to reach this league
  contentEl.dataset.waitingFor = code;
  contentEl.innerHTML = `<div class="status"><span class="spinner"></span> Loading ${_preloadDoneCount}/${_preloadTotal} leagues…</div>`;

  await new Promise(resolve => {
    if (!_leagueWaiters[code]) _leagueWaiters[code] = [];
    _leagueWaiters[code].push(resolve);
  });

  // Only re-render if the user is still looking at this league
  if (currentLeague !== code) return;
  if (cache[cacheKey]) {
    contentEl.dataset.waitingFor = '';
    render(code, cache[cacheKey]);
  } else {
    contentEl.dataset.waitingFor = '';
    contentEl.innerHTML = `<div class="error"><strong>Couldn't load data.</strong><br>${_leagueErrors[code] || 'Unknown error'}</div>`;
  }
}

/* ── Build league tabs ── */
const tabsEl = document.getElementById('tabs');
LEAGUE_GROUPS.forEach(group => {
  const groupWrap = document.createElement('div');
  groupWrap.className = 'tab-group';

  const groupBtns = document.createElement('div');
  groupBtns.className = 'tab-group-btns';
  group.leagues.forEach(l => {
    const btn = document.createElement('button');
    btn.className    = 'tab tab-unloaded' + (l.code === currentLeague ? ' active' : '');
    if (l.flagCode) {
      btn.innerHTML = `<img class="flag-icon" src="https://flagcdn.com/w20/${l.flagCode}.png" alt="" /> ${l.label}`;
    } else {
      btn.textContent = l.label;
    }
    btn.dataset.code = l.code;
    btn.setAttribute('aria-label', `Show ${l.label} form table`);
    btn.onclick = () => switchLeague(l.code);
    groupBtns.appendChild(btn);
  });
  groupWrap.appendChild(groupBtns);
  tabsEl.appendChild(groupWrap);
});

switchLeague(currentLeague);
preloadAllLeagues();

// Ensure rawCache has data for a specific season for all leagues
// Called on demand when a historical date is selected
async function ensureSeasonLoaded(asOf) {
  const season = seasonYearForDate(asOf);
  const currentYear = new Date().getFullYear();
  // Free tier only supports recent seasons — cap at currentYear-1 minimum
  // Seasons older than 2 years back are restricted on the free plan
  const minSeason = currentYear - 2;
  if (season < minSeason) {
    document.getElementById('bets-content').innerHTML =
      `<p class="bets-empty">Season ${season}/${season+1} data is not available on the free tier (limit: last 2 seasons).</p>`;
    return;
  }
  for (const { code } of LEAGUES) {
    const cacheKey = code + '_s' + season;
    if (rawCache[cacheKey]) continue;
    try {
      const sd = await apiFetch(`/competitions/${code}/standings?season=${season}`);
      const md = await apiFetch(`/competitions/${code}/matches?season=${season}`);
      rawCache[cacheKey] = { standData: sd, allMatchData: md };
    } catch { /* silent fail — may not be available */ }
  }
}
</script>
